services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    networks:
      - laravel_network

    depends_on:
      - mysql


  nginx:
    image: nginx:1.28-alpine

    container_name: nginx_server

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel_network


  mysql:
    image: mysql:8.0

    container_name: mysql_database

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      TZ: Europe/Berlin

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel_network


  # =====================================================
  # Laravel Scheduler
  # =====================================================

  scheduler:
    image: deliveryapp-backend-laravel-app

    container_name: laravel_scheduler

    restart: unless-stopped

    working_dir: /var/www

    entrypoint: ""

    command: >
      sh -c "while true;
      do php artisan schedule:run --verbose --no-interaction;
      sleep 60;
      done"

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - laravel_network



  # =====================================================
  # Laravel Queue Worker
  # =====================================================

  queue:
    image: deliveryapp-backend-laravel-app

    container_name: laravel_queue

    restart: unless-stopped

    working_dir: /var/www

    entrypoint: ""

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - laravel_network



volumes:

  mysql_data:


networks:

  laravel_network:
    driver: bridge
